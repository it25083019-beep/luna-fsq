<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c9b6e8" />
  <title>LUNA — ログイン</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0:#e8dff7; --bg1:#d4e8f8; --bg2:#f7e6f0;
      --card:rgba(255,255,255,.92); --text:#4a3b6b; --muted:#8a7aa8;
      --lilac:#9b7ed9; --lilac-deep:#7b5eb8; --mint:#6ec9b8; --danger:#e07a8a;
      --shadow:0 14px 36px rgba(120,90,180,.16);
      --input-bg:#f6f1fc; --ghost-bg:#efe8f8;
      --glow-a:rgba(155,126,217,.35); --glow-b:rgba(240,168,200,.3);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:"M PLUS Rounded 1c","Zen Maru Gothic",sans-serif;color:var(--text);
      background:
        radial-gradient(800px 420px at 80% 10%, var(--glow-a), transparent 55%),
        radial-gradient(700px 400px at 10% 90%, var(--glow-b), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 50%, var(--bg2));
    }
    .shell{max-width:420px;margin:0 auto;padding:1.25rem 1rem 2rem}
    .top{text-align:center;margin-bottom:.25rem}
    .top h1{margin:0;font-family:"Zen Maru Gothic",sans-serif;font-size:1.15rem;color:var(--lilac-deep);font-weight:700}
    .hero{display:flex;justify-content:center;margin:.4rem 0 .2rem}
    .hero img{height:min(42vh,300px);width:auto;max-width:100%;object-fit:contain;background:transparent;filter:drop-shadow(0 12px 22px rgba(120,90,180,.22));animation:float 3.8s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .panel{background:var(--card);border-radius:28px;padding:1.15rem 1.15rem 1.35rem;box-shadow:var(--shadow)}
    .panel h2{margin:0 0 .85rem;font-size:1.05rem;color:var(--lilac-deep);text-align:center}
    label{display:block;font-size:.75rem;color:var(--muted);margin:.55rem 0 .25rem}
    input{width:100%;padding:.75rem .9rem;border:none;background:var(--input-bg);color:var(--text);font:inherit;border-radius:14px;outline:none}
    input:focus{box-shadow:0 0 0 2px color-mix(in srgb, var(--lilac) 45%, transparent)}
    .row{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap;justify-content:center}
    button{font:inherit;cursor:pointer;border:none;border-radius:999px;padding:.7rem 1.15rem}
    button.primary{background:linear-gradient(135deg,var(--mint),var(--lilac-deep));color:#fff;font-weight:700;min-width:60%}
    button.ghost{background:var(--ghost-bg);color:var(--lilac-deep)}
    button.linkish{background:none;color:var(--lilac);padding:.35rem;text-decoration:underline;font-size:.85rem}
    .err{color:var(--danger);font-size:.85rem;margin-top:.75rem;min-height:1.2em;text-align:center}
    .hint{font-size:.75rem;color:var(--muted);line-height:1.5;margin:.55rem 0 0;text-align:center}
    .hidden{display:none!important}
  </style>
  <script src="/static/theme.js"></script>
  <script>LunaTheme.boot();</script>
</head>
<body>
  <div class="shell">
    <div class="top"><h1>ログイン</h1></div>
    <div class="hero">
      <img src="/static/live2d/luna-expressions/luna-wave.png" alt="LUNA" id="heroLuna" />
    </div>
    <section class="panel">
      <h2 id="authTitle">LUNAへようこそ</h2>
      <form id="authForm">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="username" required placeholder="you@example.com" />
        <div id="passwordBlock">
          <label for="password">パスワード</label>
          <input id="password" type="password" autocomplete="current-password" required minlength="6" />
        </div>
        <div id="resetTokenBlock" class="hidden">
          <label for="resetToken">再設定トークン</label>
          <input id="resetToken" type="text" autocomplete="off" />
          <label for="newPassword">新しいパスワード</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6" />
        </div>
        <div class="row">
          <button type="submit" id="authSubmit" class="primary">ログイン</button>
        </div>
        <div class="row">
          <button type="button" id="toggleMode" class="ghost">新規登録はこちら</button>
        </div>
      </form>
      <p class="hint">
        <button type="button" id="forgotBtn" class="linkish">パスワードを忘れた場合</button>
        <span id="backToLoginWrap" class="hidden"> · <button type="button" id="backToLoginBtn" class="linkish">ログインに戻る</button></span>
      </p>
      <p class="err" id="authError"></p>
      <p class="hint" id="authHint">管理者・ユーザー共通。ログイン後に自動で振り分けます。</p>
      <p class="hint hidden" id="resetDevLink"></p>
    </section>
  </div>
  <script src="/static/auth-common.js"></script>
  <script>
    let registerMode = false, forgotMode = false, resetMode = false, busy = false;
    const authForm = document.getElementById("authForm");
    const authTitle = document.getElementById("authTitle");
    const authSubmit = document.getElementById("authSubmit");
    const authError = document.getElementById("authError");
    const authHint = document.getElementById("authHint");
    const resetDevLink = document.getElementById("resetDevLink");
    const heroLuna = document.getElementById("heroLuna");

    function setAuthMode(mode) {
      forgotMode = mode === "forgot";
      resetMode = mode === "reset";
      registerMode = mode === "register";
      const login = !forgotMode && !resetMode && !registerMode;
      authTitle.textContent = forgotMode ? "パスワード再設定" : resetMode ? "新しいパスワード" : registerMode ? "新規登録" : "LUNAへようこそ";
      authSubmit.textContent = forgotMode ? "送信" : resetMode ? "更新" : registerMode ? "登録して開始" : "ログイン";
      heroLuna.src = forgotMode || resetMode
        ? "/static/live2d/luna-expressions/luna-think.png"
        : registerMode
          ? "/static/live2d/luna-expressions/luna-happy.png"
          : "/static/live2d/luna-expressions/luna-wave.png";
      document.getElementById("toggleMode").classList.toggle("hidden", forgotMode || resetMode);
      document.getElementById("forgotBtn").classList.toggle("hidden", forgotMode || resetMode);
      document.getElementById("backToLoginWrap").classList.toggle("hidden", login);
      document.getElementById("passwordBlock").classList.toggle("hidden", forgotMode || resetMode);
      document.getElementById("resetTokenBlock").classList.toggle("hidden", !resetMode);
      document.getElementById("password").required = login || registerMode;
      document.getElementById("resetToken").required = resetMode;
      document.getElementById("newPassword").required = resetMode;
      authError.textContent = "";
      resetDevLink.classList.add("hidden");
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts));
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error(LunaAuth.formatApiError(res, data));
      return data;
    }

    document.getElementById("toggleMode").onclick = () => setAuthMode(registerMode ? "login" : "register");
    document.getElementById("forgotBtn").onclick = () => setAuthMode("forgot");
    document.getElementById("backToLoginBtn").onclick = () => setAuthMode("login");

    authForm.onsubmit = async (ev) => {
      ev.preventDefault();
      if (busy) return;
      busy = true;
      authSubmit.disabled = true;
      authError.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        if (forgotMode) {
          const data = await api("/auth/forgot-password", { method: "POST", body: JSON.stringify({ email }) });
          authError.style.color = "var(--mint)";
          authError.textContent = data.message || "送信しました";
          if (data.reset_url) {
            resetDevLink.classList.remove("hidden");
            resetDevLink.innerHTML = '開発用: <a href="' + data.reset_url + '">再設定リンク</a>';
          }
          setAuthMode("reset");
          return;
        }
        if (resetMode) {
          const tokenVal = document.getElementById("resetToken").value.trim() || new URLSearchParams(location.search).get("reset") || "";
          await api("/auth/reset-password", { method: "POST", body: JSON.stringify({ token: tokenVal, new_password: document.getElementById("newPassword").value }) });
          history.replaceState({}, "", "/login");
          setAuthMode("login");
          authError.style.color = "var(--mint)";
          authError.textContent = "パスワードを更新しました。ログインしてください。";
          return;
        }
        const path = registerMode ? "/auth/register" : "/auth/login";
        const data = await api(path, { method: "POST", body: JSON.stringify({ email, password }) });
        LunaAuth.redirectAfterLogin(data);
      } catch (e) {
        authError.style.color = "var(--danger)";
        authError.textContent = e.message || String(e);
      } finally {
        busy = false;
        authSubmit.disabled = false;
      }
    };

    (async function boot() {
      const resetFromUrl = new URLSearchParams(location.search).get("reset");
      if (resetFromUrl) {
        setAuthMode("reset");
        document.getElementById("resetToken").value = resetFromUrl;
        return;
      }
      const token = LunaAuth.getToken();
      if (!token) return;
      try {
        const res = await fetch("/auth/me", { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) { LunaAuth.clearToken(); return; }
        const me = await res.json();
        LunaAuth.redirectAfterLogin({ access_token: token, is_admin: me.is_admin });
      } catch (_) {
        LunaAuth.clearToken();
      }
    })();
  </script>
</body>
</html>
